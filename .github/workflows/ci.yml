name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MentorPath.slnx

      - name: Build (warnings as errors)
        run: dotnet build MentorPath.slnx --no-restore -c Release

      - name: Vulnerable packages
        run: |
          dotnet list MentorPath.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qE "^\s+>.*\s(High|Critical)\s" vulnerable.txt; then
            echo "::error::High or Critical vulnerable package found"
            exit 1
          fi

      - name: EF model matches migrations
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations has-pending-model-changes --project src/MentorPath.Data --startup-project src/MentorPath.Web --no-build --configuration Release

      - name: Unit tests
        run: dotnet test tests/MentorPath.UnitTests --no-build -c Release --logger "trx;LogFileName=unit.trx"

      - name: Integration tests (PostgreSQL via Testcontainers)
        run: dotnet test tests/MentorPath.IntegrationTests --no-build -c Release --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  e2e-smoke:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_HOST_PORT: 25432
      AZURITE_HOST_PORT: 11000
      MAILPIT_SMTP_HOST_PORT: 11025
      MAILPIT_UI_HOST_PORT: 18025
      APP_HOST_PORT: 18080
      BASE_URL: http://localhost:18080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Start disposable application stack
        run: docker compose --profile app up --detach --build

      - name: Seed demo data
        run: docker compose --profile app exec --no-TTY app dotnet MentorPath.Web.dll seed-demo --force > /dev/null

      - name: Wait for application readiness
        run: timeout 120s sh -c 'until curl --fail --silent "$BASE_URL/health/ready" > /dev/null; do sleep 2; done'

      - name: Install Playwright and Chromium
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run browser smoke
        working-directory: tests/e2e
        run: npm run smoke

      - name: Capture stack status on failure
        if: failure()
        run: |
          mkdir -p tests/e2e/shots
          docker compose --profile app ps --all > tests/e2e/shots/compose-status.txt

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-smoke-failure
          path: tests/e2e/shots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop and remove disposable application stack
        if: always()
        run: docker compose --profile app down --volumes --remove-orphans

  docker-image:
    runs-on: ubuntu-latest
    needs: [build-test, e2e-smoke]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build container image
        run: docker build -t mentorpath:${{ github.sha }} .
