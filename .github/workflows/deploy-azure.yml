name: Deploy Azure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet restore MentorPath.slnx
      - run: dotnet build MentorPath.slnx --no-restore --configuration Release
      - name: Verify EF model matches migrations
        run: |
          set -euo pipefail
          EF_VERSION="$(python3 -c 'import xml.etree.ElementTree as E; print(next(p.attrib["Version"] for p in E.parse("Directory.Packages.props").iter("PackageVersion") if p.attrib.get("Include")=="Microsoft.EntityFrameworkCore.Design"))')"
          dotnet tool install dotnet-ef --tool-path "$RUNNER_TEMP/ef" --version "$EF_VERSION"
          "$RUNNER_TEMP/ef/dotnet-ef" migrations has-pending-model-changes \
            --project src/MentorPath.Data --startup-project src/MentorPath.Web --no-build --configuration Release
      - run: dotnet test tests/MentorPath.UnitTests --no-build --configuration Release
      - run: dotnet test tests/MentorPath.IntegrationTests --no-build --configuration Release

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP: ${{ vars.AZURE_WEBAPP_NAME }}
      ACR: ${{ vars.AZURE_ACR_NAME }}
      PG: ${{ vars.AZURE_POSTGRES_NAME }}
      VAULT: ${{ vars.AZURE_KEY_VAULT_NAME }}
      STORAGE: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      BACKUP_CONTAINER: deployment-backups
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      FIREWALL_RULE: github-${{ github.run_id }}-${{ github.run_attempt }}
      AZURE_CORE_OUTPUT: none
      AZURE_CORE_ONLY_SHOW_ERRORS: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for name in RG APP ACR PG VAULT STORAGE AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if ! printenv "$name" | grep -q .; then
              echo "::error::Missing production environment variable: $name"
              exit 1
            fi
          done

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Publish migration CLI from the same revision
        run: dotnet publish src/MentorPath.Web --configuration Release --output "$RUNNER_TEMP/mentorpath-admin" /p:UseAppHost=false

      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check target and build immutable image
        run: |
          set -euo pipefail
          STATE="$(az webapp show -g "$RG" -n "$APP" --query state -o tsv)"
          if [[ "$STATE" != Running ]]; then
            echo "::error::Target app is not running; resolve the previous deployment before continuing."
            exit 1
          fi
          HOST="$(az webapp show -g "$RG" -n "$APP" --query defaultHostName -o tsv)"
          PREVIOUS_IMAGE="$(az webapp config show -g "$RG" -n "$APP" --query linuxFxVersion -o tsv)"
          if [[ "$PREVIOUS_IMAGE" != DOCKER\|* ]]; then
            echo "::error::Expected an existing classic custom-container app."
            exit 1
          fi
          az webapp config appsettings list -g "$RG" -n "$APP" -o json |
            python3 -c 'import json,sys; c={x["name"]:x["value"] for x in json.load(sys.stdin)}; assert c.get("Database__MigrateOnStartup", "").lower()=="false", "Disable startup migrations before deploying"'
          LOGIN_SERVER="$(az acr show -g "$RG" -n "$ACR" --query loginServer -o tsv)"
          echo "PUBLIC_URL=https://$HOST" >> "$GITHUB_ENV"
          echo "LOGIN_SERVER=$LOGIN_SERVER" >> "$GITHUB_ENV"
          {
            echo "### Azure release"
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- Previous image: \`$PREVIOUS_IMAGE\`"
            echo "- Target: https://$HOST"
          } >> "$GITHUB_STEP_SUMMARY"
          az acr login --name "$ACR"
          docker build --platform linux/amd64 --tag "$LOGIN_SERVER/mentorpath:$IMAGE_TAG" .
          # Catch missing Blazor framework assets before stopping the live application.
          docker run --rm --entrypoint sh "$LOGIN_SERVER/mentorpath:$IMAGE_TAG" \
            -c 'test -s /app/wwwroot/_framework/blazor.web.js'
          docker push "$LOGIN_SERVER/mentorpath:$IMAGE_TAG"
          echo "IMAGE=$LOGIN_SERVER/mentorpath:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Load masked database credentials
        run: |
          set -euo pipefail
          DB_CONNECTION="$(az keyvault secret show --vault-name "$VAULT" --name db-connection --query value -o tsv)"
          PG_PASSWORD="$(az keyvault secret show --vault-name "$VAULT" --name pg-app-password --query value -o tsv)"
          echo "::add-mask::$DB_CONNECTION"
          echo "::add-mask::$PG_PASSWORD"
          test -n "$DB_CONNECTION"
          test -n "$PG_PASSWORD"
          # These are the database and non-admin login provisioned by the Azure guide.
          [[ "$DB_CONNECTION" == "Host=$PG.postgres.database.azure.com;Port=5432;Database=mentorpath;Username=mentorpath_app;"* ]]
          [[ "$DB_CONNECTION" == *";SSL Mode=VerifyFull" ]]
          {
            echo "ConnectionStrings__Default=$DB_CONNECTION"
            echo "PGPASSWORD=$PG_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Allow only this runner's IPv4 for database administration
        id: firewall
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl --fail --silent --show-error --retry 3 https://api.ipify.org)"
          python3 -c 'import ipaddress,sys; assert ipaddress.ip_address(sys.argv[1]).version == 4' "$RUNNER_IP"
          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          FIREWALL_URL="https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.DBforPostgreSQL/flexibleServers/$PG/firewallRules/$FIREWALL_RULE?api-version=2024-08-01"
          echo "FIREWALL_URL=$FIREWALL_URL" >> "$GITHUB_ENV"
          # Mark the attempt before creation so cleanup also covers a CLI timeout.
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          az rest --method put --url "$FIREWALL_URL" \
            --body "{\"properties\":{\"startIpAddress\":\"$RUNNER_IP\",\"endIpAddress\":\"$RUNNER_IP\"}}"
          docker pull postgres:17

      - name: Save a private pre-migration database backup
        run: |
          set -euo pipefail
          umask 077
          CONNECTION="host=$PG.postgres.database.azure.com dbname=mentorpath user=mentorpath_app sslmode=verify-full sslrootcert=/etc/ssl/certs/ca-certificates.crt connect_timeout=15"
          for attempt in {1..12}; do
            if docker run --rm -e PGPASSWORD -v /etc/ssl/certs:/etc/ssl/certs:ro postgres:17 \
              psql "$CONNECTION" --no-psqlrc --command 'SELECT 1' > /dev/null; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "::error::Database is unreachable; the live app has not been stopped."
              exit 1
            fi
            sleep 10
          done
          docker run --rm -e PGPASSWORD -v /etc/ssl/certs:/etc/ssl/certs:ro postgres:17 \
            pg_dump --dbname "$CONNECTION" --format custom --no-owner --no-privileges \
            > "$RUNNER_TEMP/mentorpath-predeploy.dump"
          test -s "$RUNNER_TEMP/mentorpath-predeploy.dump"
          docker run --rm -i postgres:17 pg_restore --list < "$RUNNER_TEMP/mentorpath-predeploy.dump" > /dev/null
          BACKUP_BLOB="releases/$(date -u +%Y/%m/%d)/$IMAGE_TAG.dump"
          az storage blob upload --account-name "$STORAGE" --container-name "$BACKUP_CONTAINER" \
            --auth-mode login --name "$BACKUP_BLOB" --file "$RUNNER_TEMP/mentorpath-predeploy.dump" \
            --overwrite false
          echo "- Pre-migration backup: \`$BACKUP_CONTAINER/$BACKUP_BLOB\` (private Blob)" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop application for maintenance
        id: maintenance
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          az webapp stop -g "$RG" -n "$APP"
          for attempt in {1..30}; do
            STATE="$(az webapp show -g "$RG" -n "$APP" --query state -o tsv)"
            if [[ "$STATE" == Stopped ]]; then exit 0; fi
            sleep 5
          done
          echo "::error::App did not stop; migrations were not started."
          exit 1

      - name: Apply migrations once
        env:
          ASPNETCORE_ENVIRONMENT: Production
          Storage__Provider: AzureBlob
          Storage__EnsureContainerOnStartup: "false"
          Database__MigrateOnStartup: "false"
          Logging__LogLevel__Default: Warning
        run: |
          set -euo pipefail
          export Storage__AzureBlob__ServiceUri="https://$STORAGE.blob.core.windows.net"
          export Storage__AzureBlob__ContainerName=mentorpath
          export App__PublicBaseUrl="$PUBLIC_URL"
          cd "$RUNNER_TEMP/mentorpath-admin"
          dotnet MentorPath.Web.dll migrate

      - name: Update container and start application
        run: |
          set -euo pipefail
          az webapp config container set -g "$RG" -n "$APP" \
            --container-image-name "$IMAGE" --container-registry-url "https://$LOGIN_SERVER"
          az webapp start -g "$RG" -n "$APP"

      - name: Verify readiness and browser assets
        id: healthy
        run: |
          set -euo pipefail
          for attempt in {1..40}; do
            if BODY="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$PUBLIC_URL/health/ready")" &&
              [[ "$BODY" == Healthy ]]; then
              break
            fi
            if [[ "$attempt" == 40 ]]; then
              echo "::error::Deployment did not become ready."
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error --max-time 30 "$PUBLIC_URL/health/live"
          curl --fail --silent --show-error --max-time 30 "$PUBLIC_URL/Account/Login" --output /dev/null
          curl --fail --silent --show-error --max-time 30 "$PUBLIC_URL/_framework/blazor.web.js" \
            --output "$RUNNER_TEMP/mentorpath-blazor.js"
          test -s "$RUNNER_TEMP/mentorpath-blazor.js"
          echo "- Deployed image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Readiness, liveness, login page and Blazor script: passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove only this run's database firewall rule
        if: always() && steps.firewall.outputs.attempted == 'true'
        run: |
          set -euo pipefail
          az rest --method delete --url "$FIREWALL_URL"

      - name: Report unsuccessful maintenance
        if: always() && steps.maintenance.outputs.attempted == 'true' && steps.healthy.outcome != 'success'
        run: |
          echo "::error::Deployment failed during maintenance. Inspect app state and migration results before restarting or rolling back; schema changes are not automatically reversed."
          echo "- **Failed during maintenance.** Inspect Azure app state and migration results. No automatic schema/image rollback. Use the recovery procedure in docs/AZURE_DEPLOYMENT.md." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local backup and registry credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/mentorpath-predeploy.dump"
          if [[ -n "${LOGIN_SERVER:-}" ]]; then docker logout "$LOGIN_SERVER"; fi
