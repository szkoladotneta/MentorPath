# Local development infrastructure. Credentials below are local-only defaults, never used in production.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mentorpath
      POSTGRES_USER: mentorpath
      POSTGRES_PASSWORD: mentorpath
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentorpath -d mentorpath"]
      interval: 5s
      timeout: 3s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: "azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck --silent"
    environment:
      AZURITE_ACCOUNTS: "mentorpath:bWVudG9ycGF0aC1sb2NhbC1kZXYta2V5LW9ubHk="
    ports:
      - "${AZURITE_HOST_PORT:-10000}:10000"
    volumes:
      - blobdata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"

  # Full stack (opt-in): docker compose --profile app up -d --build
  migrate:
    profiles: ["app"]
    build: .
    command: ["migrate"]
    environment: &app-env
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=mentorpath;Username=mentorpath;Password=mentorpath"
      App__PublicBaseUrl: "http://localhost:8080"
      App__DisableHttpsRedirection: "true"
      Storage__AzureBlob__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=mentorpath;AccountKey=bWVudG9ycGF0aC1sb2NhbC1kZXYta2V5LW9ubHk=;BlobEndpoint=http://azurite:10000/mentorpath;"
      Storage__EnsureContainerOnStartup: "true"
      Email__Smtp__Host: "mailpit"
      Email__Smtp__Port: "1025"
      Ai__Provider: "Fake"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: ["app"]
    build: .
    environment: *app-env
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    volumes:
      - dpkeys:/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
      azurite:
        condition: service_started

volumes:
  dpkeys:
  pgdata:
  blobdata:
