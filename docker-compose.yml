# Local development infrastructure. Credentials below are local-only defaults, never used in production.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mentorpath
      POSTGRES_USER: mentorpath
      POSTGRES_PASSWORD: mentorpath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentorpath -d mentorpath"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # S3-compatible private object storage for local development (SeaweedFS S3 gateway).
    image: chrislusf/seaweedfs:latest
    command: "server -s3 -dir=/data -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json"
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Full stack (opt-in): docker compose --profile app up -d --build
  migrate:
    profiles: ["app"]
    build: .
    command: ["migrate"]
    environment: &app-env
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=mentorpath;Username=mentorpath;Password=mentorpath"
      App__PublicBaseUrl: "http://localhost:8080"
      App__DisableHttpsRedirection: "true"
      Storage__S3__ServiceUrl: "http://s3:8333"
      Storage__S3__AccessKey: "mentorpath"
      Storage__S3__SecretKey: "mentorpath-dev-secret"
      Email__Smtp__Host: "mailpit"
      Email__Smtp__Port: "1025"
      Ai__Provider: "Fake"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: ["app"]
    build: .
    environment: *app-env
    ports:
      - "8080:8080"
    volumes:
      - dpkeys:/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_started

volumes:
  dpkeys:
  pgdata:
  s3data:
