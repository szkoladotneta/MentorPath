name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MentorPath.slnx

      - name: Build (warnings as errors)
        run: dotnet build MentorPath.slnx --no-restore -c Release

      - name: Unit tests
        run: dotnet test tests/MentorPath.UnitTests --no-build -c Release --logger "trx;LogFileName=unit.trx"

      - name: Integration tests (PostgreSQL via Testcontainers)
        run: dotnet test tests/MentorPath.IntegrationTests --no-build -c Release --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  docker-image:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t mentorpath:${{ github.sha }} .
