name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MentorPath.slnx

      - name: Build (warnings as errors)
        run: dotnet build MentorPath.slnx --no-restore -c Release

      - name: Vulnerable packages
        run: |
          dotnet list MentorPath.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qE "^\s+>.*\s(High|Critical)\s" vulnerable.txt; then
            echo "::error::High or Critical vulnerable package found"
            exit 1
          fi

      - name: EF model matches migrations
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations has-pending-model-changes --project src/MentorPath.Data --startup-project src/MentorPath.Web --no-build --configuration Release

      - name: Unit tests
        run: dotnet test tests/MentorPath.UnitTests --no-build -c Release --logger "trx;LogFileName=unit.trx"

      - name: Integration tests (PostgreSQL via Testcontainers)
        run: dotnet test tests/MentorPath.IntegrationTests --no-build -c Release --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  docker-image:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build container image
        run: docker build -t mentorpath:${{ github.sha }} .
